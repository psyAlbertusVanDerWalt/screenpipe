name: Deploy graphiti-ingester

# Path-filtered on purpose. The skill's "build unconditionally" rule targets per-job `if:`
# change detection (`contains(toJSON(github.event.commits.*))`), which silently skips jobs and
# is genuinely unreliable. A workflow-level `paths:` trigger is a different, dependable
# mechanism — and this is a Java service inside a Rust/Tauri monorepo, so without it every
# unrelated screenpipe commit would rebuild and redeploy this image.
# Use the Run workflow button (workflow_dispatch) to force a build regardless.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/graphiti-ingester/**'
      - '.github/workflows/deploy-graphiti-ingester.yml'
  pull_request:
    paths:
      - 'apps/graphiti-ingester/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/graphiti-ingester

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 exactly. Lombok cannot parse a newer JDK's AST and fails with
      # `ExceptionInInitializerError: com.sun.tools.javac.code.TypeTag :: UNKNOWN`, which names
      # a javac internal and gives no hint that the JDK version is the problem.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: apps/graphiti-ingester/pom.xml

      - name: Run tests
        run: mvn -B test

  build-and-push:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: test
    # Never publish an image from a PR — the registry should only ever hold what is on main.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set image tags
        id: tags
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Plain docker build, not docker/build-push-action with buildx: buildx runs BuildKit in
      # an isolated container that cannot inherit the Docker credentials, which breaks auth
      # against the self-hosted registry.
      - name: Build image
        run: |
          docker build \
            -t ${{ vars.REGISTRY_URL }}/graphiti-ingester:${{ steps.tags.outputs.sha }} \
            -t ${{ vars.REGISTRY_URL }}/graphiti-ingester:latest \
            .

      - name: Push image
        run: |
          docker push ${{ vars.REGISTRY_URL }}/graphiti-ingester:${{ steps.tags.outputs.sha }}
          docker push ${{ vars.REGISTRY_URL }}/graphiti-ingester:latest

      - name: Deploy via Coolify
        run: |
          curl -s -f "${{ vars.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
