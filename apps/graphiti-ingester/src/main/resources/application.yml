spring:
  application:
    name: graphiti-ingester
  datasource:
    # Every value is env-overridable. A hardcoded datasource URL is the exact thing that
    # makes an app work locally and fail in the container it was built for.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphiti_ingester}
    username: ${DATASOURCE_USERNAME:graphiti}
    password: ${DATASOURCE_PASSWORD:graphiti}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. ddl-auto would silently diverge the container's schema
      # from the migrations that are supposed to define it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

ingest:
  export-dir: ${INGEST_EXPORT_DIR:/data/redacted-jsonl}
  group-id: ${INGEST_GROUP_ID:screenpipe}
  day-boundary-zone: ${INGEST_DAY_BOUNDARY_ZONE:Africa/Johannesburg}
  max-episode-body-chars: 12000
  min-episode-body-chars: 40
  batch-size: 500
  schedule:
    enabled: ${INGEST_SCHEDULE_ENABLED:true}
    # Inside working hours on purpose — the workstation hosting both the export files and
    # the Ollama endpoint is asleep outside them.
    cron: ${INGEST_SCHEDULE_CRON:0 0 10,15 * * MON-FRI}

graphiti:
  mcp-url: ${GRAPHITI_MCP_URL:http://10.0.0.69:18000/mcp/}
  request-timeout: ${GRAPHITI_REQUEST_TIMEOUT:5m}
  max-attempts: 4
  initial-backoff: 5s
  max-backoff: 2m
  verify-after-post: ${GRAPHITI_VERIFY_AFTER_POST:true}
  verify-delay: 20s
  verify-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    za.co.albertusvdw.graphiti: ${LOG_LEVEL:INFO}
