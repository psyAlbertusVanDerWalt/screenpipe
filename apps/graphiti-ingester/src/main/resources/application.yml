spring:
  application:
    name: graphiti-ingester
  datasource:
    # Every value is env-overridable. A hardcoded datasource URL is the exact thing that
    # makes an app work locally and fail in the container it was built for.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphiti_ingester}
    username: ${DATASOURCE_USERNAME:graphiti}
    password: ${DATASOURCE_PASSWORD:graphiti}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. ddl-auto would silently diverge the container's schema
      # from the migrations that are supposed to define it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

ingest:
  export-dir: ${INGEST_EXPORT_DIR:/data/redacted-jsonl}
  group-id: ${INGEST_GROUP_ID:screenpipe}
  # Shared secret for the workstation's push. Blank disables the upload endpoint rather
  # than leaving it open — it writes files that become graph content.
  upload-token: ${INGEST_UPLOAD_TOKEN:}
  max-upload-bytes: 67108864
  day-boundary-zone: ${INGEST_DAY_BOUNDARY_ZONE:Africa/Johannesburg}
  # graphiti-core's extraction has been observed to silently under-extract — miss entities
  # and relationships with no error — on episodes beyond roughly 10,000 characters. Kept
  # safely under that rather than at the model's hard context ceiling.
  max-episode-body-chars: ${INGEST_MAX_EPISODE_BODY_CHARS:8000}
  min-episode-body-chars: 40
  batch-size: 500
  schedule:
    enabled: ${INGEST_SCHEDULE_ENABLED:true}
    # Inside working hours on purpose — the workstation hosting both the export files and
    # the Ollama endpoint is asleep outside them.
    cron: ${INGEST_SCHEDULE_CRON:0 0 10,15 * * MON-FRI}

graphiti:
  mcp-url: ${GRAPHITI_MCP_URL:http://10.0.0.69:18000/mcp}
  # Host graphiti-mcp's rebinding protection expects — its internal port, not the published
  # one. Blank sends no override.
  host-header: ${GRAPHITI_HOST_HEADER:localhost:8000}
  request-timeout: ${GRAPHITI_REQUEST_TIMEOUT:5m}
  max-attempts: 4
  initial-backoff: 5s
  max-backoff: 2m
  verify-after-post: ${GRAPHITI_VERIFY_AFTER_POST:true}
  # 10 x 30s = 5 minutes. Extraction has been measured from 18s to over 180s; a shorter
  # budget declares successful episodes dropped.
  verify-delay: 30s
  verify-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    za.co.albertusvdw.graphiti: ${LOG_LEVEL:INFO}
