# `mvn wrapper:wrapper` generated this pinned to a bare "3", producing a distributionUrl for
# apache-maven-3-bin which does not exist — the Docker build failed on a wget 404 that looked
# like a network problem. Pin the real version.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.10/apache-maven-3.9.10-bin.zip
